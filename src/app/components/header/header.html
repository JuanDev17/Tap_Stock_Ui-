
<header class="app-header">
  <div class="header-container">
    <span class="title">TapStock<span class="accent">.</span></span>
  </div>
</header>

<main class="page-container">
  <section class="hero-section">

    <div class="hero-text">
      <div class="hero-content">
        <span class="eyebrow">YOUR KITCHEN, ORGANIZED</span>

        <h1>Fridge List<span class="accent">.</span></h1>

        <p class="hero-description">
          Shared list for the whole kitchen.
          Keep track of what you need, all in one place.
        </p>
      </div>

      <div class="hero-img">
        <mat-icon>kitchen</mat-icon>
      </div>
    </div>

    <section class="hero-actions">
      <div class="reset">
        <span class="reset-sec">30 SEC RESET</span>

        <h2>Scan the fridge</h2>

        <p>Find the almost-gone stuff before it's gone.</p>
      </div>

      <button
        mat-icon-button
        class="scan-button"
        aria-label="Scan NFC tag"
      >
        <mat-icon>qr_code_scanner</mat-icon>
      </button>
    </section>

  </section>
</main>
